name: Monthly Data Update

# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: GitHub automatically disables scheduled workflows when a
# repository has had NO activity for 60 days.  If your data has gone stale
# after a long quiet period, re-enable the workflow from:
#   https://github.com/reversesingularity/phobetron_web_app/actions
# Then click "Enable workflow".  You can also trigger a one-off run with
# the "Run workflow" button on the Actions tab.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Run on the 1st of every month at 2 AM UTC
  schedule:
    - cron: '0 2 1 * *'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days of history to fetch (earthquakes / solar)'
        required: false
        default: '30'
      neo_days_ahead:
        description: 'Days ahead to fetch for NEO close approaches'
        required: false
        default: '90'

jobs:
  update-earthquake-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests sqlalchemy psycopg2-binary python-dotenv
      
      - name: Fetch USGS Earthquake Data
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          DAYS=${{ github.event.inputs.days_back || '30' }}
          python backend/scripts/fetch_earthquake_data.py --days=$DAYS --min-magnitude=4.0
      
      - name: Log completion
        run: echo "✅ Earthquake data updated successfully"

  update-volcanic-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests sqlalchemy psycopg2-binary python-dotenv
      
      - name: Fetch Volcanic Activity Data
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        # Fetches current + prior year eruptions from Smithsonian GVP
        run: python backend/scripts/fetch_volcanic_data_standalone.py
      
      - name: Log completion
        run: echo "✅ Volcanic data updated successfully"

  update-neo-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests sqlalchemy psycopg2-binary python-dotenv
      
      - name: Fetch NASA NEO Data
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          DAYS=${{ github.event.inputs.neo_days_ahead || '90' }}
          # Loops through the full range in 7-day API chunks
          python backend/scripts/fetch_neo_data.py --days=$DAYS
      
      - name: Log completion
        run: echo "✅ NEO data updated successfully"

  update-solar-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests sqlalchemy psycopg2-binary python-dotenv
      
      - name: Fetch Solar Event Data (NASA DONKI)
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          DAYS=${{ github.event.inputs.days_back || '30' }}
          # Uses NASA DONKI flare + geomagnetic storm catalog (not NOAA sensor feed)
          python backend/scripts/fetch_solar_events.py --days=$DAYS
      
      - name: Log completion
        run: echo "✅ Solar event data updated successfully"

  recalculate-correlations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs: [update-earthquake-data, update-volcanic-data, update-neo-data, update-solar-events]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install sqlalchemy psycopg2-binary python-dotenv numpy scikit-learn
      
      - name: Recalculate ML Correlations
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python backend/scripts/recalculate_correlations.py
      
      - name: Summary
        run: |
          echo "🎉 Monthly data update completed!"
          echo "Updated: Earthquakes, Volcanoes (GVP), NEOs (NASA, full range), Solar Events (DONKI)"
          echo "Timestamp: $(date -u)"
          echo ""
          echo "View this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
