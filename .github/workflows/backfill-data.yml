name: Backfill Historical Data

# Run this ONCE (manually) to catch up on missed months.
# Fetches a longer date range than the normal monthly job.
#
# How to trigger:
#   1. Go to Actions tab in GitHub
#   2. Select "Backfill Historical Data"
#   3. Click "Run workflow"
#   4. Adjust the date ranges if needed and click the green button

on:
  workflow_dispatch:
    inputs:
      earthquake_days:
        description: 'Days back to fetch earthquake data'
        required: false
        default: '180'
      solar_days:
        description: 'Days back to fetch solar event data'
        required: false
        default: '180'
      neo_days_ahead:
        description: 'Days ahead to fetch NEO close approaches'
        required: false
        default: '90'

jobs:
  backfill-earthquakes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests sqlalchemy psycopg2-binary python-dotenv
      - name: Backfill USGS Earthquake Data
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          DAYS=${{ github.event.inputs.earthquake_days || '180' }}
          python backend/scripts/fetch_earthquake_data.py --days=$DAYS --min-magnitude=4.0

  backfill-volcanoes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests sqlalchemy psycopg2-binary python-dotenv
      - name: Backfill Volcanic Eruption Data (current + prior 2 years)
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        # The standalone script already fetches current year and prior year
        run: python backend/scripts/fetch_volcanic_data_standalone.py

  backfill-neos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests sqlalchemy psycopg2-binary python-dotenv
      - name: Backfill NASA NEO Data
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          DAYS=${{ github.event.inputs.neo_days_ahead || '90' }}
          python backend/scripts/fetch_neo_data.py --days=$DAYS

  backfill-solar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests sqlalchemy psycopg2-binary python-dotenv
      - name: Backfill Solar Event Data (NASA DONKI)
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          DAYS=${{ github.event.inputs.solar_days || '180' }}
          python backend/scripts/fetch_solar_events.py --days=$DAYS

  recalculate-correlations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backfill-earthquakes, backfill-volcanoes, backfill-neos, backfill-solar]
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install sqlalchemy psycopg2-binary python-dotenv numpy scikit-learn
      - name: Recalculate ML Correlations
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: python backend/scripts/recalculate_correlations.py
      - name: Summary
        run: |
          echo "🎉 Backfill completed!"
          echo "View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
